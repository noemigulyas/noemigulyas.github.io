<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/tumor.png" />
        <link rel="stylesheet" href="/tumor.css" />
        <title>Is it gone yet?</title>
    </head>
    <body>
        <button id="show" onclick="onShow()">Show</button>
        <h1 id="title" style="visibility: collapse">
            Time until tumor removal:
        </h1>
        <span id="countdown" style="visibility: collapse"></span>
    </body>
    <script>
        const show = document.getElementById("show");
        const title = document.getElementById("title");
        const countdown = document.getElementById("countdown");
        const audio = new Audio("/tumor.ogg");
        let soundCanPlay = false;
        let soundStarted = false;
        function onShow() {
            show.style.visibility = "collapse";
            title.style.visibility = "visible";
            countdown.style.visibility = "visible";
            audio.play().then(() => {
                audio.pause();
                soundCanPlay = true;
            });
        }
        const p = (x, n) => String(x).padStart(n, "0");
        const step = () => {
            const now = new Date();
            const target = new Date(2027, 10, 1);
            const total = Math.floor((target - now) / 1000);
            const seconds = Math.floor(total) % 60;
            const minutes = Math.floor(total / 60) % 60;
            const hours = Math.floor(total / 60 / 60) % 24;
            const days = Math.floor(total / 60 / 60 / 24);
            const text = `${p(days, 3)}:${p(hours, 2)}:${p(minutes, 2)}:${p(seconds, 2)}`;
            if (countdown.innerText !== text) {
                countdown.innerText = text;
                if (soundCanPlay && !soundStarted) {
                    const run = () => {
                        audio.currentTime = 0;
                        audio.play();
                        setTimeout(run, 4000);
                    };
                    run();
                    soundStarted = true;
                }
            }
            requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    </script>
</html>
